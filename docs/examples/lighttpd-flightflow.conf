# FlightFlow behind lighttpd on port 80, next to tar1090.
# Install: sudo cp lighttpd-flightflow.conf /etc/lighttpd/conf-available/97-flightflow.conf
#          sudo lighty-enable-mod flightflow && sudo systemctl reload lighttpd
# FlightFlow must listen on 127.0.0.1:8080 (see docs/raspberry-pi.md).

server.modules += ( "mod_proxy", "mod_redirect" )

# The apps, the API and the optional airline logos are served by the container.
$HTTP["url"] =~ "^/(map|analytics|portrait|api|logos)(/|$)" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8080 ) ) )
}

# Optional: a landing page at /flightflow/ (the container serves it at /).
# $HTTP["url"] =~ "^/flightflow/?$" { url.redirect = ( ".*" => "/map/" ) }

# Optional: keep links from an older install working.
# url.redirect += ( "^/radarowl/?(.*)$" => "/map/$1" )
