[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flightflow"
version = "0.1.0"
description = "FlightFlow collector: ADS-B ingestion, history and API for the FlightFlow web apps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
flightflow = "flightflow.cli:main"

[tool.setuptools.packages.find]
include = ["flightflow*"]

[tool.setuptools.package-data]
flightflow = ["migrations/*.py", "migrations/versions/*.py", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP031"]
